# nginx site for sgaingredients.com — forwards to the pm2 app "sga" on port 3001.
# Installed to /etc/nginx/sites-available/sgaingredients.com by deploy/setup-server.sh.
# certbot adds the HTTPS (443) lines to the installed copy; don't overwrite it after that.
server {
    listen 80;
    listen [::]:80;
    server_name sgaingredients.com www.sgaingredients.com;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
